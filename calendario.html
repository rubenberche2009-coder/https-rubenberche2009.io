
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diciembre para ti ❤️</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #f8f4ed;
    color: #25221e;
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
}

.container {
    max-width: 1250px;
    margin: auto;
    padding: 65px 35px;
}

.main {
    display: grid;
    grid-template-columns: 0.8fr 1.2fr;
    gap: 55px;
    align-items: center;
}

.intro {
    max-width: 420px;
}

.intro h1 {
    font-size: clamp(38px, 5vw, 57px);
    line-height: 1.05;
    font-weight: 800;
    letter-spacing: -2px;
    margin-bottom: 22px;
}

.intro h1 span {
    color: #b52d23;
}

.intro p {
    color: #77716a;
    font-size: 15px;
    line-height: 1.8;
    margin-bottom: 25px;
}

.info {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 13px;
    color: #625c55;
    margin: 17px 0;
}

.info span {
    background: #e9dfd1;
    color: #a52d24;
    width: 25px;
    height: 25px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
}

/* CALENDARIO */

.calendar {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    grid-auto-rows: 75px;
    grid-auto-flow: dense;
    gap: 8px;
    transform: rotate(-1deg);
}

.day {
    border: none;
    border-radius: 9px;
    background: #b92e24;
    color: white;
    font-family: 'DM Sans', sans-serif;
    font-size: 27px;
    font-weight: 800;
    cursor: pointer;
    transition: 0.25s ease;
    box-shadow: 0 3px 7px #0000000c;
}

.day:nth-child(3n) {
    background: #8f211b;
}

.day:nth-child(4n) {
    background: #eadfd3;
    color: #a32a22;
}

.day:nth-child(5n) {
    background: #f0e8df;
    color: #a32a22;
}

.day:nth-child(7n) {
    background: #c83c30;
    color: white;
}

.day:hover:not(:disabled) {
    transform: scale(1.06);
    box-shadow: 0 7px 17px #00000020;
    z-index: 2;
}

.day:active:not(:disabled) {
    transform: scale(0.94);
}

.day:nth-child(4n+1) {
    grid-column: span 1;
}

.day:nth-child(5n+2) {
    grid-column: span 2;
}

.day:nth-child(7n+3) {
    grid-row: span 2;
}

.day:nth-child(11n+5) {
    grid-column: span 2;
}

/* DÍAS BLOQUEADOS */

.day:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    box-shadow: none;
}

/* PIE */

.footer {
    text-align: center;
    margin-top: 55px;
    color: #aaa096;
    font-size: 12px;
    letter-spacing: 1px;
}

/* VENTANA EMERGENTE */

.overlay {
    position: fixed;
    inset: 0;
    background: #211814b8;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 10;
    backdrop-filter: blur(5px);
}

.overlay.active {
    display: flex;
    animation: fadeIn 0.3s ease;
}

.modal {
    background: #faf6ef;
    width: 100%;
    max-width: 430px;
    min-height: 300px;
    border-radius: 18px;
    padding: 35px;
    text-align: center;
    position: relative;
    animation: appear 0.35s ease;
}

.close {
    position: absolute;
    top: 15px;
    right: 18px;
    border: none;
    background: none;
    font-size: 27px;
    color: #8f8176;
    cursor: pointer;
}

.modal .small {
    color: #b52d23;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 3px;
    margin-top: 20px;
}

.modal h2 {
    font-family: 'Playfair Display', serif;
    font-size: 42px;
    color: #a52b22;
    margin: 18px 0;
}

.modal-content {
    min-height: 90px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #625c55;
    font-size: 16px;
    line-height: 1.8;
}

.modal-decoration {
    color: #c03a30;
    font-size: 25px;
    margin-top: 10px;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(20px) scale(0.95);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* MÓVILES */

@media (max-width: 850px) {
    .container {
        padding: 45px 22px;
    }

    .main {
        grid-template-columns: 1fr;
        gap: 35px;
    }

    .intro {
        max-width: 100%;
    }

    .intro h1 {
        font-size: 43px;
    }

    .calendar {
        grid-auto-rows: 65px;
        gap: 6px;
    }

    .day {
        font-size: 22px;
    }
}

@media (max-width: 420px) {
    .calendar {
        grid-auto-rows: 52px;
        gap: 5px;
    }

    .day {
        font-size: 19px;
        border-radius: 6px;
    }

    .intro h1 {
        font-size: 37px;
    }
}
</style>
</head>

<body>

<div class="container">

    <main class="main">

        <section class="intro">

            <h1>
                Regálate un diciembre
                <span>especial.</span>
            </h1>

            <p>
                Un pequeño calendario preparado especialmente
                para ti. Cada día esconde una nueva sorpresa.
            </p>

            <div class="info">
                <span>1</span>
                31 días, 31 pequeñas sorpresas.
            </div>

            <div class="info">
                <span>2</span>
                Cada día tiene algo diferente.
            </div>

            <div class="info">
                <span>3</span>
                Abre una nueva casilla cada día.
            </div>

        </section>

        <section class="calendar" id="calendar"></section>

    </main>

    <div class="footer">
        DICIEMBRE · 2026 · HECHO CON CARIÑO
    </div>

</div>

<!-- VENTANA EMERGENTE -->

<div class="overlay" id="overlay">

    <div class="modal">

        <button class="close" onclick="closeModal()">×</button>

        <div class="small">DICIEMBRE</div>

        <h2 id="modalTitle">Día 1</h2>

        <div class="modal-content" id="modalContent"></div>

        <div class="modal-decoration">♥</div>

    </div>

</div>

<script>

// FECHA REAL: DICIEMBRE DE 2026

const fechaActual = new Date();

const esDiciembre =
    fechaActual.getFullYear() === 2026 &&
    fechaActual.getMonth() === 11;

const diaActual = esDiciembre
    ? fechaActual.getDate()
    : 0;


// LAS 31 FRASES

const frases = {

    1: "Quería empezar diciembre teniendo un pequeño detalle contigo.",

    2: "Espero que hoy tengas tantos motivos para sonreír como los que tú provocas.",

    3: "Hay conversaciones que pueden mejorar cualquier día, y las nuestras son una de ellas.",

    4: "Me gusta la facilidad que tienes para hacer que un momento normal sea especial.",

    5: "Nunca subestimes lo importante que puedes llegar a ser para alguien.",

    6: "Ojalá pudiera regalarte un poquito de toda la felicidad que transmites.",

    7: "Si tuviera que elegir una conversación para repetir, seguramente elegiría alguna contigo.",

    8: "Tienes una forma de ser que hace que sea difícil no cogerte cariño.",

    9: "Espero que nunca dejes de ser esa persona tan especial que eres.",

    10: "A veces no hace falta hacer grandes cosas para alegrarle el día a alguien. Tú lo haces simplemente siendo tú.",

    11: "No sé qué tendrá diciembre, pero este año tiene algo que lo hace diferente.",

    12: "Ojalá pudiera guardar todos esos pequeños momentos contigo para poder volver a vivirlos siempre que quisiera. ❤️",

    13: "¿Te gustó la sorpresa de ayer? Espero que sí, porque llevaba tiempo pensando en cómo hacer que ese día fuese especial para ti. ❤️",

    14: "Pase lo que pase, quiero que sepas que me alegro muchísimo de haberte conocido.",

    15: "Me encanta poder compartir momentos contigo, incluso los más simples.",

    16: "Si alguna vez dudas de lo especial que eres, espero que recuerdes que hay personas que tienen mucha suerte de tenerte cerca.",

    17: "Una de las mejores cosas de este año ha sido coincidir contigo.",

    18: "Me gustan tus bromas, tus ocurrencias y hasta esas pequeñas cosas que seguramente tú ni notas.",

    19: "Ojalá podamos seguir acumulando recuerdos que algún día nos hagan sonreír.",

    20: "No hace falta que sea un día perfecto para que sea bonito. A veces basta con compartirlo con las personas adecuadas.",

    21: "Gracias por cada conversación, cada risa y cada momento que hemos compartido.",

    22: "Si algo tengo claro es que conocerte ha sido una de esas casualidades que agradezco.",

    23: "Espero que hoy sonrías mucho. Te lo mereces.",

    24: "Esta Navidad solo quiero desearte cosas bonitas, porque te mereces todo lo bueno que te pase.",

    25: "Feliz Navidad. Espero que estés rodeada de personas que te quieran y que tengas un día precioso. ❤️",

    26: "Qué suerte haber coincidido contigo entre tantas personas.",

    27: "Nunca sabes cuándo alguien va a convertirse en una persona importante para ti.",

    28: "Me gustaría que dentro de mucho tiempo pudiéramos recordar este diciembre con una sonrisa.",

    29: "Gracias por ser tú, sin necesidad de cambiar absolutamente nada.",

    30: "Se acaba el año, pero espero que todavía nos queden muchísimos momentos por compartir.",

    31: "Último día del calendario, pero ojalá sea solo el principio de muchos recuerdos bonitos juntos. ❤️"

};


// CREAR LOS 31 DÍAS

const calendar = document.getElementById("calendar");

for (let i = 1; i <= 31; i++) {

    const day = document.createElement("button");

    day.className = "day";
    day.textContent = i;

    if (i > diaActual) {

        day.disabled = true;
        day.title = "Todavía no disponible";

    } else {

        day.addEventListener("click", function() {
            openDay(i);
        });

    }

    calendar.appendChild(day);

}


// ABRIR UN DÍA

function openDay(number) {

    if (
        !esDiciembre ||
        number > diaActual ||
        number < 1 ||
        number > 31
    ) {
        return;
    }

    document.getElementById("modalTitle").textContent =
        "Día " + number;

    document.getElementById("modalContent").textContent =
        frases[number];

    document.getElementById("overlay").classList.add("active");

}


// CERRAR VENTANA

function closeModal() {

    document.getElementById("overlay").classList.remove("active");

}


// CERRAR AL PULSAR FUERA

document.getElementById("overlay").addEventListener("click", function(e) {

    if (e.target === this) {
        closeModal();
    }

});


// CERRAR CON ESCAPE

document.addEventListener("keydown", function(e) {

    if (e.key === "Escape") {
        closeModal();
    }

});

</script>

</body>
</html>
